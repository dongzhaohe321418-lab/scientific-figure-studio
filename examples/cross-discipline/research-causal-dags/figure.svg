<text id="confounder-line1" data-editable="true" x="355" y="803" font-size="28" fill="#223842" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="28">Conditioning on Z blocks</tspan></text>
<text id="confounder-line2" data-editable="true" x="355" y="848" font-size="28" fill="#223842" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="28">the backdoor path X ← Z → Y.</tspan></text>
<text id="mediator-note" data-editable="true" x="1000" y="319" font-size="27" fill="#223842" text-anchor="middle" font-weight="400" font-style="italic"><tspan dy="0" font-size="27">On a causal pathway</tspan></text>
<text id="mediator-line-0" data-editable="true" x="1000" y="803" font-size="27" fill="#223842" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="27">For the total effect, do not adjust</tspan></text>
<text id="mediator-line-1" data-editable="true" x="1000" y="848" font-size="27" fill="#223842" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="27">away the mediated pathway.</tspan></text>
<text id="mediator-line-2" data-editable="true" x="1000" y="893" font-size="23" fill="#61727b" text-anchor="middle" font-weight="400" font-style="italic"><tspan dy="0" font-size="23">Statement applies to the graph shown.</tspan></text>
