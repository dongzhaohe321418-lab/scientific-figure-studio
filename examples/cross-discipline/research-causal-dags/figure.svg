</g>
<text id="condition-legend-text" data-editable="true" x="1565" y="1017" font-size="25" fill="#223842" text-anchor="start" font-weight="400"><tspan dy="0" font-size="25">Dashed outline: conditioning</tspan></text>
<text id="xy-legend" data-editable="true" x="460" y="1017" font-size="27" fill="#223842" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="27">X: exposure   ·   Y: outcome</tspan></text>
<text id="principle" data-editable="true" x="1000" y="1080" font-size="31" fill="#223842" text-anchor="middle" font-weight="600"><tspan dy="0" font-size="31">Draw causal assumptions before selecting adjustment variables.</tspan></text>
<text id="footer-1" data-editable="true" x="1000" y="1132" font-size="24" fill="#61727b" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="24">Arrows encode assumed direct causal relations. A graph does not establish an empirical effect or a complete identification strategy.</tspan></text>
<text id="footer-2" data-editable="true" x="1000" y="1170" font-size="24" fill="#61727b" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="24">Illustrative DAGs; statements apply to the depicted paths and assumptions. Conditioning does not create a causal arrow.</tspan></text>
