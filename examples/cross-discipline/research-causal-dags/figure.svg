<text id="collider-line-0" data-editable="true" x="1645" y="803" font-size="27" fill="#223842" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="27">Without conditioning: path blocked.</tspan></text>
<text id="collider-line-1" data-editable="true" x="1645" y="848" font-size="27" fill="#223842" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="27">Conditioning on C can open</tspan></text>
<text id="collider-line-2" data-editable="true" x="1645" y="893" font-size="27" fill="#223842" text-anchor="middle" font-weight="400"><tspan dy="0" font-size="27">a noncausal association.</tspan></text>
